services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - jobster-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    ports:
      - "8000:8000"
    volumes:
      - jobster-dynamodb:/home/dynamodblocal/data

volumes:
  jobster-mongo:
  jobster-dynamodb:
