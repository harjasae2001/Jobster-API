AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

# ─────────────────────────────────────────────────────────────────────────────
# Jobster Serverless — AWS SAM Template
#
# Resources provisioned:
#   - DynamoDB Table (JobsterTable)            single-table design, PAY_PER_REQUEST
#   - 5 Lambda Functions                       Node.js 20.x, 128 MB
#   - API Gateway REST API                     with CORS + request validation
#   - S3 Bucket (Frontend)                     static site hosting
#   - CloudFront Distribution                  CDN + HTTPS for the S3 frontend
#   - IAM Roles (per Lambda, least-privilege)  scoped DynamoDB permissions
#
# Region: ap-south-1 (Mumbai) — set in samconfig.toml
# ─────────────────────────────────────────────────────────────────────────────

Description: >
  Jobster API Serverless Stack — Lambda + DynamoDB + API Gateway + S3 + CloudFront (ap-south-1)

# ── Parameters ────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]
    Description: Deployment environment

  JwtSecret:
    Type: String
    NoEcho: true  # Masked in CloudFormation console and CLI output
    Description: JWT signing secret (keep this long and random — min 32 chars)
    MinLength: 16

  JwtLifetime:
    Type: String
    Default: 1d
    Description: JWT expiry (e.g. 1d, 7d, 1h)

  FrontendBucketSuffix:
    Type: String
    Default: a7f3k9
    Description: >
      Random suffix for the globally-unique S3 bucket name.
      Full name will be: jobster-frontend-<suffix>

# ── Globals — applied to all SAM Lambda functions ─────────────────────────────
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64          # Graviton2 — ~20% cheaper than x86, same performance for I/O-bound code
    MemorySize: 128    # Minimum needed for these handlers; keeps cost near-zero
    Timeout: 10        # Generous timeout; DynamoDB calls are typically < 100ms
    Tracing: Active    # Enable AWS X-Ray — captures cold start, handler duration, DDB latency
                       # INTERVIEW NOTE: 'Active' samples 5% of requests automatically.
                       # 'PassThrough' only traces when upstream (API GW) requests tracing.
                       # 'Active' is correct here since API GW is our entry point.
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsterTable
        JWT_SECRET: !Ref JwtSecret
        JWT_LIFETIME: !Ref JwtLifetime
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'  # Reuse HTTP keep-alive connections to DDB
        ENVIRONMENT: !Ref Environment              # Used by EMF metrics for dimension
    Layers:
      - !Ref DependenciesLayer  # Shared node_modules layer to keep function ZIPs small

# ── Resources ─────────────────────────────────────────────────────────────────
Resources:

  # ── LAYER: Shared node_modules ───────────────────────────────────────────────
  # Packages (bcryptjs, jsonwebtoken, uuid, aws-sdk, http-status-codes) are
  # bundled once into a Lambda Layer. This means each function ZIP is < 10 KB
  # (just the handler code), which dramatically speeds up cold starts.
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'jobster-deps-${Environment}'
      Description: Shared Node.js dependencies for Jobster Lambda functions
      ContentUri: ./
      CompatibleRuntimes:
        - nodejs24.x
      RetentionPolicy: Delete  # Remove old layer versions on update
    Metadata:
      BuildMethod: nodejs24.x
      BuildProperties:
        EntryPoints:
          - package.json

  # ── DYNAMODB TABLE ────────────────────────────────────────────────────────────
  # Single-table design:
  #   - Users:  PK=USER#<email>     SK=PROFILE  (login lookup)
  #             PK=USERID#<userId>  SK=PROFILE  (auth middleware lookup)
  #   - Jobs:   PK=USER#<userId>    SK=JOB#<jobId>
  #
  # INTERVIEW NOTE — PAY_PER_REQUEST vs. PROVISIONED:
  #   PAY_PER_REQUEST (on-demand) mode has no minimum cost and scales automatically.
  #   For a portfolio project with bursty/intermittent traffic, on-demand is ideal.
  #   Provisioned capacity would be cheaper at sustained high throughput (>1000 RCU/WCU)
  #   but requires capacity planning and auto-scaling config.
  JobsterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'JobsterTable-${Environment}'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true  # Free PITR window; good practice
      SSESpecification:
        SSEEnabled: true  # Server-side encryption at rest (AES-256, KMS-managed)
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1: email → user lookup (used by login to find user by email)
        # NOTE: In our implementation login does a direct GetItem on USER#<email>
        # so GSI1 is included here for reference/flexibility but not actively used.
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: Jobster
        - Key: Environment
          Value: !Ref Environment

  # ── IAM ROLE BASE: Auth Functions ────────────────────────────────────────────
  AuthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'JobsterAuthLambdaRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Basic Lambda execution: CloudWatch Logs write access
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # X-Ray: allows Lambda to send trace segments to the X-Ray daemon
        # INTERVIEW NOTE: The X-Ray daemon runs as a sidecar process inside the
        # Lambda execution environment — Lambda handles it automatically when
        # Tracing: Active is set. This policy just grants write permission.
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: DynamoDBAuthAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # INTERVIEW NOTE — Least Privilege:
              # Auth functions need PutItem (register), GetItem (login by email/userId).
              # They do NOT need DeleteItem, UpdateItem, or Scan — so we don't grant them.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem   # register: create user records
                  - dynamodb:GetItem   # login: fetch user by email or userId
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt JobsterTable.Arn
                  - !Sub '${JobsterTable.Arn}/index/GSI1'

  # ── IAM ROLE BASE: Jobs Functions ────────────────────────────────────────────
  JobsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'JobsterJobsLambdaRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess  # X-Ray trace segments
      Policies:
        - PolicyName: DynamoDBJobsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Jobs functions do NOT need GSI access — they query by user PK directly
              - Effect: Allow
                Action:
                  - dynamodb:PutItem   # createJob
                  - dynamodb:GetItem   # getJob
                  - dynamodb:Query     # getAllJobs (by user PK + SK prefix)
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt JobsterTable.Arn
                  # No GSI ARN here — jobs functions never touch GSI1

  # ── API GATEWAY ───────────────────────────────────────────────────────────────
  JobsterApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'jobster-api-${Environment}'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      # Request validation (rejects missing body/params at gateway level — before Lambda)
      Models:
        RegisterRequest:
          type: object
          required:
            - name
            - email
            - password
          properties:
            name:
              type: string
            email:
              type: string
            password:
              type: string
        LoginRequest:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
            password:
              type: string
      Tags:
        Project: Jobster
        Environment: !Ref Environment

  # ── LAMBDA: Auth Register ──────────────────────────────────────────────────
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-auth-register-${Environment}'
      CodeUri: src/
      Handler: handlers/auth-register.handler
      Role: !GetAtt AuthFunctionRole.Arn
      Description: 'POST /api/v1/auth/register — create a new Jobster user account'
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/auth/register
            Method: POST

  # ── LAMBDA: Auth Login ──────────────────────────────────────────────────────
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-auth-login-${Environment}'
      CodeUri: src/
      Handler: handlers/auth-login.handler
      Role: !GetAtt AuthFunctionRole.Arn
      Description: 'POST /api/v1/auth/login — authenticate and receive JWT'
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/auth/login
            Method: POST

  # ── LAMBDA: Get All Jobs ────────────────────────────────────────────────────
  GetAllJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-jobs-get-all-${Environment}'
      CodeUri: src/
      Handler: handlers/jobs-get-all.handler
      Role: !GetAtt JobsFunctionRole.Arn
      Description: 'GET /api/v1/jobs — search and list jobs with filters, sort, pagination'
      Events:
        GetAllJobsApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/jobs
            Method: GET

  # ── LAMBDA: Create Job ──────────────────────────────────────────────────────
  CreateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-jobs-create-${Environment}'
      CodeUri: src/
      Handler: handlers/jobs-create.handler
      Role: !GetAtt JobsFunctionRole.Arn
      Description: 'POST /api/v1/jobs — create a new job listing'
      Events:
        CreateJobApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/jobs
            Method: POST

  # ── LAMBDA: Get Single Job ──────────────────────────────────────────────────
  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-jobs-get-one-${Environment}'
      CodeUri: src/
      Handler: handlers/jobs-get-one.handler
      Role: !GetAtt JobsFunctionRole.Arn
      Description: 'GET /api/v1/jobs/{id} — fetch a single job by ID (ownership-scoped)'
      Events:
        GetJobApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/jobs/{id}
            Method: GET

      # ── LAMBDA: Update Job ──────────────────────────────────────────────────────
  UpdateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-jobs-update-${Environment}'
      CodeUri: src/
      Handler: handlers/jobs-update.handler
      Role: !GetAtt JobsFunctionRole.Arn
      Description: 'PATCH /api/v1/jobs/{id} — update a job listing'
      Events:
        UpdateJobApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/jobs/{id}
            Method: PATCH

  # ── LAMBDA: Delete Job ──────────────────────────────────────────────────────
  DeleteJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-jobs-delete-${Environment}'
      CodeUri: src/
      Handler: handlers/jobs-delete.handler
      Role: !GetAtt JobsFunctionRole.Arn
      Description: 'DELETE /api/v1/jobs/{id} — delete a job listing'
      Events:
        DeleteJobApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/jobs/{id}
            Method: DELETE

  # ── LAMBDA: Job Stats ───────────────────────────────────────────────────────
  JobStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-jobs-stats-${Environment}'
      CodeUri: src/
      Handler: handlers/jobs-stats.handler
      Role: !GetAtt JobsFunctionRole.Arn
      Description: 'GET /api/v1/jobs/stats — job status counts and monthly chart data'
      Events:
        JobStatsApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/jobs/stats
            Method: GET

  # ── LAMBDA: Update User ─────────────────────────────────────────────────────
  UpdateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'jobster-auth-update-user-${Environment}'
      CodeUri: src/
      Handler: handlers/auth-update-user.handler
      Role: !GetAtt AuthFunctionRole.Arn
      Description: 'PATCH /api/v1/auth/updateUser — update user profile'
      Events:
        UpdateUserApi:
          Type: Api
          Properties:
            RestApiId: !Ref JobsterApi
            Path: /api/v1/auth/updateUser
            Method: PATCH

  # ── SNS: Alarm Notification Topic ──────────────────────────────────────────
  # All CloudWatch Alarms publish to this topic.
  # Add more subscriptions (PagerDuty, Slack webhook, etc.) here as the system grows.
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'jobster-alarms-${Environment}'
      Tags:
        - Key: Project
          Value: Jobster

  # Email subscription — harjas.singh.dev@gmail.com receives alarm notifications
  # IMPORTANT: AWS sends a confirmation email to this address after first deploy.
  # You must click the confirmation link for notifications to start.
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: harjas.singh.dev@gmail.com

  # ── CLOUDWATCH ALARM: Lambda Errors ─────────────────────────────────────────
  # Fires if any Lambda function throws more than 5 errors in a 5-minute window.
  # Covers ALL Lambda errors from ALL functions in this account/region.
  # INTERVIEW NOTE: Lambda errors = unhandled exceptions that crash the handler.
  # Caught errors returned as 4xx/5xx responses are NOT Lambda errors — they
  # complete successfully from Lambda's perspective.
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Jobster-LambdaErrors-${Environment}'
      AlarmDescription: 'Lambda function error rate exceeded 5 in 5 minutes — check CloudWatch Logs'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub 'jobster-auth-register-${Environment}'
      Statistic: Sum
      Period: 300       # 5-minute evaluation window
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching  # No data = no alarms (not an error condition)
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # ── CLOUDWATCH ALARM: API Gateway 5xx Errors ─────────────────────────────────
  # Fires on 3+ server errors in 5 minutes on any API endpoint.
  # 5xx errors indicate Lambda crashes or unhandled exceptions.
  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Jobster-ApiGateway5xx-${Environment}'
      AlarmDescription: 'API Gateway 5xx error rate exceeded 3 in 5 minutes'
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub 'jobster-api-${Environment}'
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # ── CLOUDWATCH ALARM: DynamoDB Throttling ────────────────────────────────────
  # Fires on ANY throttled request — zero tolerance since we use PAY_PER_REQUEST.
  # DynamoDB throttling on on-demand mode indicates a burst exceeding 40,000 RCU/WCU.
  # INTERVIEW NOTE: PAY_PER_REQUEST has burst limits. If traffic spikes suddenly,
  # DDB may throttle briefly before scaling. This alarm catches that.
  DynamoDBThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Jobster-DynamoDBThrottles-${Environment}'
      AlarmDescription: 'DynamoDB throttled requests detected — investigate traffic spike'
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref JobsterTable
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # ── CLOUDWATCH ALARM: Lambda p99 Duration ────────────────────────────────────
  # Fires when 99th percentile response time exceeds 3 seconds.
  # p99 (not average) catches tail latency — the slowest 1% of requests.
  # INTERVIEW NOTE: Averaging hides outliers. A p99 of 3s means 1 in 100
  # users waits 3s+ — that's a real user experience problem even if avg is 200ms.
  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'Jobster-LambdaDuration-p99-${Environment}'
      AlarmDescription: 'Lambda p99 duration exceeded 3000ms — possible cold start or DDB latency spike'
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Sub 'jobster-jobs-get-all-${Environment}'
      ExtendedStatistic: p99  # CloudWatch percentile statistic
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # ── CLOUDWATCH DASHBOARD ──────────────────────────────────────────────────────
  # Operational overview: Lambda health, API Gateway traffic, DynamoDB usage, custom metrics.
  # Access at: https://ap-south-1.console.aws.amazon.com/cloudwatch/home#dashboards
  JobsterDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'JobsterDashboard-${Environment}'
      DashboardBody: !Sub |-
        {
          "widgets": [
            {
              "type": "alarm",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "title": "Alarm Status",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:Jobster-LambdaErrors-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:Jobster-ApiGateway5xx-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:Jobster-DynamoDBThrottles-${Environment}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:Jobster-LambdaDuration-p99-${Environment}"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations & Errors",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "jobster-auth-register-${Environment}", {"label": "register"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "jobster-auth-login-${Environment}", {"label": "login"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "jobster-jobs-get-all-${Environment}", {"label": "getAllJobs"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "jobster-jobs-create-${Environment}", {"label": "createJob"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "jobster-auth-register-${Environment}", {"label": "register errors", "color": "#d62728"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration — p50 / p99 (ms)",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "jobster-jobs-get-all-${Environment}", {"stat": "p50", "label": "getAllJobs p50"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "jobster-jobs-get-all-${Environment}", {"stat": "p99", "label": "getAllJobs p99", "color": "#ff7f0e"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "jobster-auth-register-${Environment}", {"stat": "p50", "label": "register p50"}],
                  ["AWS/Lambda", "Duration", "FunctionName", "jobster-auth-register-${Environment}", {"stat": "p99", "label": "register p99", "color": "#d62728"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway — Request Count & Error Rates",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "jobster-api-${Environment}", "Stage", "${Environment}", {"label": "Total Requests"}],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "jobster-api-${Environment}", "Stage", "${Environment}", {"label": "4xx Errors", "color": "#ff7f0e"}],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "jobster-api-${Environment}", "Stage", "${Environment}", {"label": "5xx Errors", "color": "#d62728"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB — Consumed Capacity",
                "view": "timeSeries",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "JobsterTable-${Environment}", {"label": "Read CU"}],
                  ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "JobsterTable-${Environment}", {"label": "Write CU"}],
                  ["AWS/DynamoDB", "SuccessfulRequestLatency", "TableName", "JobsterTable-${Environment}", "Operation", "Query", {"label": "Query Latency (ms)", "yAxis": "right"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Custom Metrics — Business Events (EMF)",
                "view": "timeSeries",
                "metrics": [
                  ["Jobster/API", "UserRegistered", "Environment", "${Environment}", {"label": "Registrations"}],
                  ["Jobster/API", "HandlerError", "Environment", "${Environment}", {"label": "Handler Errors", "color": "#d62728"}],
                  ["Jobster/API", "RegistrationConflict", "Environment", "${Environment}", {"label": "Duplicate Emails", "color": "#ff7f0e"}]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Custom Metrics — Handler Duration p99 (ms)",
                "view": "timeSeries",
                "metrics": [
                  ["Jobster/API", "HandlerDuration", "FunctionName", "jobster-auth-register-${Environment}", "Environment", "${Environment}", {"stat": "p99", "label": "register p99"}]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  # ── S3 BUCKET: Frontend Static Site ─────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'jobster-frontend-${FrontendBucketSuffix}'
      # Block all public access — CloudFront accesses S3 via OAC (Origin Access Control)
      # Users cannot bypass CloudFront to hit S3 directly
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Jobster
        - Key: Environment
          Value: !Ref Environment

  # ── CLOUDFRONT: Origin Access Control ────────────────────────────────────────
  # OAC is the modern replacement for Origin Access Identity (OAI).
  # It signs S3 requests with SigV4 so only CloudFront can read the bucket.
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'jobster-oac-${Environment}'
        Description: OAC for Jobster frontend S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 BUCKET POLICY: Allow CloudFront OAC ───────────────────────────────────
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ── CLOUDFRONT DISTRIBUTION ───────────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'Jobster frontend CDN (${Environment})'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3  # Enable HTTP/3 (QUIC) for best performance
        IPV6Enabled: true
        PriceClass: PriceClass_200  # Americas + Europe + Asia (includes ap-south-1 edge)
        # Origins
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}  # Required empty object when using OAC
          - Id: ApiOrigin
            DomainName: !Sub '${JobsterApi}.execute-api.ap-south-1.amazonaws.com'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        # Cache Behaviours
        CacheBehaviors:
          # API routes — no caching (always forward to API Gateway)
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
            CachedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
        # Default behaviour — serve React SPA from S3
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          DefaultTTL: 86400        # 1 day cache for static assets
          MinTTL: 0
          MaxTTL: 31536000         # 1 year max
          Compress: true           # Gzip/Brotli compression at edge
        # SPA routing — return index.html for 403/404 so React Router works
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Project
          Value: Jobster
        - Key: Environment
          Value: !Ref Environment

# ── Outputs ───────────────────────────────────────────────────────────────────
Outputs:
  ApiEndpoint:
    Description: API Gateway base URL
    Value: !Sub 'https://${JobsterApi}.execute-api.ap-south-1.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  FrontendURL:
    Description: CloudFront distribution URL (HTTPS frontend)
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-FrontendURL'

  FrontendBucketName:
    Description: S3 bucket name (needed by deploy-frontend.ps1)
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub '${AWS::StackName}-CloudFrontDistributionId'

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref JobsterTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  DynamoDBTableArn:
    Description: DynamoDB table ARN (for cross-stack references)
    Value: !GetAtt JobsterTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'

  AlarmTopicArn:
    Description: SNS topic ARN for CloudWatch alarm notifications
    Value: !Ref AlarmNotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlarmTopicArn'

  DashboardURL:
    Description: Direct link to the CloudWatch operational dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=JobsterDashboard-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-DashboardURL'