# SAM CLI configuration for Jobster Serverless stack
# Run `sam deploy --guided` the first time to populate s3_bucket automatically.

version = 0.1

[default.global.parameters]
stack_name = "jobster-serverless"
region = "ap-south-1"

[default.build.parameters]
cached       = true
parallel     = true

[default.deploy.parameters]
capabilities          = "CAPABILITY_IAM CAPABILITY_NAMED_IAM"
confirm_changeset     = true
resolve_s3            = true
parameter_overrides   = "Environment=\"production\" JwtLifetime=\"1d\" FrontendBucketSuffix=\"a7f3k9\""
s3_prefix = "jobster-serverless"
image_repositories = []

[default.local_start_api.parameters]
warm_containers = "EAGER"
